- period: "2026"
  items:
    - "New work on controlling diffusion models for dynamic systems, *Contrastive Diffusion Alignment* (`ConDA`), accepted at **ICML 2026**. Congratulations to **Ruchi Sandilya** and the team."

- period: "2025"
  items:
    - "**Logan Grosenick** is awarded an **NIH ORIP R01** (R01OD039830)."
    - "**Marzieh Ajirak**'s work on adaptive routing for multimodal clinical prediction is accepted at **NeurIPS 2025**."
    - "Work led by postdoc **Isaac Kauvar** on the emergence of emotion across humans and mice is published in **Science**."
    - "Congratulations to **Dr. Amanda Buch**, who starts her own lab at **Duke University** as Assistant Professor of Psychiatry & Bioengineering."
    - "Congratulations to **Dr. Isaac Kauvar**, now an AI Scientist at **Anthropic**."
    - "Congratulations to **Catherine Parkin** on her acceptance to the PhD program in neuroscience at **Columbia University**."

- period: "2024"
  items:
    - "`QuantNets` (generalizing CNNs to graphs) accepted at **NeurIPS 2024**. Congratulations to **Isaac Osafo Nkansah**, **Neil Gallagher**, and **Ruchi Sandilya**."
    - "`EpiCare` (an RL benchmark for dynamic treatment regimes) accepted at **NeurIPS 2024**. Congratulations to **Mason Hargrave**."
    - "**Marzieh Ajirak**'s work is accepted at **EUSIPCO 2024**."
    - "**Amanda Buch**'s work on simple and scalable algorithms for cluster-aware precision medicine and subtyping is published at **AISTATS 2024**."
    - "Congratulations to **Dr. Amanda Buch** on a **SFARI Bridge to Independence** award, a **Burroughs Wellcome Fund / Revson** scholarship, and a **2024 Leading Edge Fellowship**."
    - "Congratulations to **Dr. Marzieh Ajirak** on the **2024 Perry Scholar Award**."
    - "Congratulations to **Isabella Karabinas** on a **Best Poster Award** at the Machine Learning Summer School (OIST, Okinawa) 2024."

- period: "2023"
  items:
    - "Congratulations to **Logan Grosenick** on a **Whitehall Foundation** research grant."
    - "**Logan Grosenick** and **Dr. Nili Solomonov** receive a **Cornell Center for Pandemic Prevention and Response (CCPPR)** grant."
    - "**Amanda Buch**'s work on subtypes of autism spectrum disorder is published in **Nature Neuroscience**."
    - "Congratulations to **Dr. Marzieh Ajirak** and **Dr. Karsten Gimre** on **T32 postdoctoral fellowships**."
    - "Congratulations to **Dr. Amanda Buch** on the **2023 Perry Scholar Award**."
    - "Congratulations to **Ellie Bowen** on her acceptance to the **University of Michigan Medical School**."

