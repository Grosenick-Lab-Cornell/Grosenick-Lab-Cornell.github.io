# Global site configuration. Edit copy here; components read from this file.

name: Grosenick Lab
shortName: Grosenick Lab
# Hero headline. Key terms wrapped in **bold** render emphasized/accented.
headline: "AI and neuroengineering to **improve mental health**"
# Significance-first mission (see MISSION.md for the longer draft + alternates).
tagline: >-
  We build artificial intelligence and neuroengineering tools to understand
  psychiatric illness and match each patient to the treatment most likely to
  help them.
affiliationLine: "A lab led by Logan Grosenick at Weill Cornell Medicine, Cornell University."

institution: Weill Cornell Medicine
university: Cornell University

contact:
