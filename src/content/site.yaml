  coordinatorEmail: jas4060@med.cornell.edu
  office: "1300 York Ave, Rm F-1338, New York, NY"
  github: https://github.com/Grosenick-Lab-Cornell
  githubOrg: Grosenick-Lab-Cornell
  bluesky: https://bsky.app/profile/logangrosenick.bsky.social
