# ---- PI ----
- name: Logan Grosenick
  role: Principal Investigator
  status: current
  order: 0
  url: "/pi"
  photo: /images/people/logan-grosenick.jpg
  bio: >-
    Logan leads the lab's work at the intersection of machine learning,
    statistics, and neuroengineering, developing methods to understand
    psychiatric illness and personalize its treatment.

# ---- Current members ----
- name: Marzieh Ajirak, PhD
  photo: /images/people/marzieh-ajirak.jpg
  role: Postdoctoral Fellow
  status: current
  order: 10
  coadvisor: Nili Solomonov
  note: Multimodal AI for treatment-response prediction from clinical video, audio, and notes.
  bio: >-
    Marzieh Ajirak is a recent graduate in Electrical and Computer Engineering,
    specializing in Machine Learning from Stony Brook University, where she
    earned her PhD. Currently, she holds the position of Postdoctoral Fellow at
    Weill Cornell Medicine. Throughout her doctoral studies, Marzieh focused on
    the critical areas of uncertainty quantification in deep learning models and
    Bayesian statistics.

- name: Karsten Gimre, PhD
  photo: /images/people/karsten-gimre.jpg
  role: Postdoctoral Fellow
  status: current
  order: 11
  note: Robust, reproducible estimators for neural connectivity and multi-omics networks.
  bio: >-
    Karsten received his B.S. in mathematics and physics from Pacific
    University. Moving to New York in 2011, he received his Ph.D. in mathematics
    from Columbia University, where he studied differential geometry, partial
    differential equations, and general relativity with Mu-Tao Wang. After an
    NSF postdoctoral research fellowship with Shing-Tung Yau in the mathematics
    department at Harvard University, he began his current postdoctoral position
    at Weill Cornell Medicine. He is interested in any mathematical aspects of
    neuroscience and applied science, including in particular
    electroencephalography, brain networks, and machine learning approaches to
    data analysis. The best book he read in the last year is the first volume of
    Robert Caro's "The Years of Lyndon Johnson," and he is learning to play the
    clarinet.

- name: Ruchi Sandilya, PhD
  photo: /images/people/ruchi-sandilya.jpg
  role: Postdoctoral Fellow
  status: current
  order: 12
  coadvisor: Conor Liston
  note: Treatment personalization via controllable counterfactuals and generative digital twins.
  bio: >-
    Ruchi is currently a postdoctoral associate at the Grosenick and Liston labs
    at Weill Cornell Medicine, where she has worked since 2021. Previously, she
    was a postdoctoral researcher at the Weierstrass Institute, Berlin, Germany
    (2019-2020), and at the TIFR Centre for Applicable Mathematics, Bangalore,
    India (2017-2019). She received her Ph.D. in Applied Mathematics from the
    Indian Institute of Space Science and Technology, India in 2017. Her area of
    expertise is finite element methods, control theory, complex dynamical
    systems, and machine learning. In her current research, she is applying the
    ideas of control theory with artificial intelligence to develop personalized
    neurostimulation for treatment-resistant depression. Outside of academic
    activities, she likes hiking and glass painting.

- name: Nathaniel Tse, PhD
  photo: /images/people/nathaniel-tse.jpg
  role: Postdoctoral Fellow
  status: current
  order: 13
  note: Label-free 3D body-mesh models of animal behavior from video.
  bio: >-
    Nate received his B.S. in pharmacology from Stony Brook University and then
    in 2024 completed his Ph.D. in pharmacology at Weill Cornell. His graduate
    work studied the protective effects of ketamine on fear behavior before
    pivoting to study the effects of stress on social behavior and
    neurodevelopment. In his postdoctoral work, he is applying machine learning
    concepts to better analyze the rich time-series data characteristic of
    complex ethology and neuronal activity.

- name: Neil Gallagher, PhD
  photo: /images/people/neil-gallagher.jpg
  role: Postdoctoral Fellow
  status: current
  order: 14
  coadvisor: Conor Liston
  note: Graph-based and causal ML for TMS+EEG in treatment-resistant depression.

- name: Isabella Karabinas
  photo: /images/people/isabella-karabinas.jpg
  role: MD-PhD Candidate
  status: current
  order: 20
  note: Neural-circuit mechanisms of treatment-resistant depression with TMS-EEG.
  bio: >-
    Bella is an MD-PhD candidate in the Tri-Institutional Weill
    Cornell/Rockefeller/Sloan-Kettering MD-PhD program, and joined the lab in
    the fall of 2023. She graduated from Oregon State University in 2020 with
    bachelor's degrees in Biochemistry & Molecular Biology and Psychology. Her
    research interests include neural oscillations, brain networks, and emotion
    regulation. Outside of the lab, Bella likes cooking, reading, and music.

- name: Jiarui "Olivia" Ao
  photo: /images/people/jiarui-olivia-ao.jpg
  role: PhD Candidate, Neuroscience
  status: current
  order: 22
  note: Comparing learned manifolds across animals and patients.
  bio: >-
    Olivia received her B.Sc. and M.Sc. in Neuroscience from McGill University,
    and is now a Ph.D. candidate of Neuroscience at Weill Cornell Graduate
    School. Her research interests include neural representation, cross-animal
    comparison and functional cell typing. Outside of the lab, you can find her
    at Reptile Expo, Broadway musicals, or at home with her paw companion.

- name: Michelle Junyi He
  photo: /images/people/michelle-he.jpg
  role: MD-PhD Student
  status: current
  order: 21
  joined: "2026"
  note: ML and neuroimaging for biologically informed patient subtypes and personalized treatment response.
  bio: >-
    Michelle went to MIT for undergraduate, where she majored in Molecular
    Biology and Brain and Cognitive Sciences. After graduation, she worked in
    Dr. Francis Lee's lab at Weill Cornell Medicine, investigating the role of
    BDNF signaling in obsessive-compulsive disorder and exploring how gut-brain
    interactions contribute to the development of repetitive behaviors. Now as a
    Tri-Institutional MD-PhD student, Michelle aims to broaden her knowledge in
    computational neuroscience and the clinical applications of her research. She
    is particularly interested in the use of machine learning and neuroimaging to
    identify biologically informed patient subtypes and develop personalized
    representations of treatment response in individuals undergoing psychotherapy.

- name: Michelle Jae Lee, MS
  photo: /images/people/michelle-jae-lee.jpg
  role: Research Associate
  status: current
  order: 26
  note: MS in Data Science and MPH at Columbia. Develops ML models for biological subtyping.

- name: Kenneth Johnson
  photo: ""   # /images/people/kenneth-johnson.jpg
  placeholder: cornell   # Cornell shield tile until a headshot is provided
  role: PhD Candidate
  status: current
  order: 23

- name: Jupinder Parmar
  photo: /images/people/jupinder-parmar.jpg
  role: PhD Candidate, Computational Biology
  status: current
  order: 24
  note: Mathematical and foundation-model methods for subtyping psychiatric conditions.
  bio: >-
    Jupinder received his B.S in mathematics and M.S. in computer science from
    Stanford University. After a stint at NVIDIA on the foundation model team
    where he contributed to the development, training, and release of open
    source LLMs, he started as a Ph.D. student in the Tri-Institutional
    Computational Biology program between Weill Cornell Medicine, Memorial Sloan
    Kettering, and Rockefeller. He is interested in the intersection of
    mathematics and neuroscience, especially in the context of subtyping
    psychiatric conditions. He is an avid runner, tennis player, and mountaineer
    (when he can escape the city).

- name: Isaac Osafo Nkansah
  photo: /images/people/isaac-osafo-nkansah.jpg
  role: PhD Candidate
  status: current
  order: 25
  bio: >-
    Isaac graduated from Stanford University, where he majored in Electrical
    Engineering with a focus on Machine Learning, AI, Information Systems, and
    Wireless Systems. In his free time he loves practicing the piano, which he
    is learning to play by ear, hiking, and listening to instrumentals.

- name: Jordan Serrano-Guedea
  photo: /images/people/jordan-serrano-guedea.jpg
  role: Lab Manager
  status: current
  order: 27
  note: High-density EEG across accelerated TMS-iTBS treatment in MDD.
  bio: >-
    Jordan graduated from the University of California, Berkeley, with a double
    B.A. in Psychology and Social Welfare. Jordan's research interests include
    developing community-specific psychotherapy interventions for individuals
    with anxiety and mood disorders and expanding access to high-quality mental
    health treatment for underrepresented communities.

